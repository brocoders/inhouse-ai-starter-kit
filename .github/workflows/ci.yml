name: CI
# Repository hygiene, and nothing else. It is cheap — a minute or so — and it
# applies to documentation as much as to code, so unlike the test suite it runs
# on every change, including the ones that only touch Markdown.
#
# A private repository gets 2,000 free Actions minutes a month. Keeping the
# expensive half in its own workflow is what makes that enough.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # check-repo.mjs walks every Git-visible file, so the tree is needed but
      # no history is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # The migration check compares server/drizzle/*.sql with main. A pull
      # request checkout has no main, so bring just its tip; on main itself the
      # comparison is trivially clean.
      - name: Fetch main for the migration check
        if: github.ref != 'refs/heads/main'
        run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - name: Secrets and instruction budgets
        run: node scripts/check-repo.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.19.0
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm format:check
      - name: Check whitespace
        run: git show --format= --check HEAD
