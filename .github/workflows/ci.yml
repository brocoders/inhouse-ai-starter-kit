name: CI
# Repository hygiene, and nothing else. It is cheap — a minute or so — and it
# applies to documentation as much as to code, so unlike the test suite it runs
# on every change, including the ones that only touch Markdown.
#
# A private repository gets 2,000 free Actions minutes a month. Keeping the
# expensive half in its own workflow is what makes that enough.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # check-repo.mjs walks every Git-visible file, so the tree is needed; the
      # whitespace check below needs this commit's parent and nothing older.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The migration check compares server/drizzle/*.sql with main. A pull
      # request checkout has no main, so bring just its tip; on main itself the
      # comparison is trivially clean.
      # The checkout keeps no credentials (persist-credentials: false), so on
      # a private repository this fetch has to carry the workflow's own token
      # itself; without it the step was the first red day of the first real
      # project. The token lives for this run only.
      - name: Fetch main for the migration check
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --depth=1 origin main:refs/remotes/origin/main
      - name: Secrets and instruction budgets
        run: node scripts/check-repo.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.19.0
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # NPM_TOKEN is for a private package, if the app has one: its .npmrc
      # names the registry and ${NPM_TOKEN}; the secret of the same name
      # fills it in here. Empty, and so harmless, until both exist.
      - run: pnpm install --frozen-lockfile --prefer-offline
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm format:check
      # Only what this commit changed. `git show --check HEAD` on a checkout
      # with no parent reads the whole tree as added and fails on any old file
      # with a trailing space — the first real project's CI was red for days.
      - name: Check whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            echo "first commit: nothing to compare against"
          fi
