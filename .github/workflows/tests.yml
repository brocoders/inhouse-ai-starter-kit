name: Tests
# The expensive half: everything `pnpm check` runs, against a real PostgreSQL.
#
# It is skipped when a change cannot possibly affect it. `paths-ignore` skips
# the workflow only when *every* changed file matches, so a commit touching one
# Markdown file and one source file still runs the suite. Documentation-only
# changes are still checked — by the CI workflow, which is what actually checks
# documentation.
#
# The service is PostgreSQL 16 because that is what the server runs. Tests use
# PGlite by default, which embeds a different major version and a single
# connection; the tests marked `postgres` are here to catch what that hides.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    # No-CI mode: set the repository variable INHOUSE_CI to "off" (Settings →
    # Secrets and variables → Actions → Variables) and this job is skipped;
    # the gate is then `pnpm check` on the laptop, which the release skill
    # runs before every release. The cheap hygiene workflow still runs.
    if: vars.INHOUSE_CI != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: inhouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d inhouse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES: '1'
      TEST_DATABASE_URL: postgresql://test:disposable-ci-only@localhost:5432/inhouse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # The migration check compares server/drizzle/*.sql with main. A pull
      # request checkout has no main, so bring just its tip; on main itself the
      # comparison is trivially clean.
      # The checkout keeps no credentials (persist-credentials: false), so on
      # a private repository this fetch has to carry the workflow's own token
      # itself; without it the step was the first red day of the first real
      # project. The token lives for this run only.
      - name: Fetch main for the migration check
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.19.0
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The lockfile is frozen, so an exact hit needs no network at all; the
      # restore key still saves most of the downloads when one dependency moves.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # NPM_TOKEN is for a private package, if the app has one: its .npmrc
      # names the registry and ${NPM_TOKEN}; the secret of the same name
      # fills it in here. Empty, and so harmless, until both exist.
      - run: pnpm install --frozen-lockfile --prefer-offline
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # `pnpm check` is the whole gate: hygiene, formatting, both typechecks,
      # the tests, the frontend build and the design checker. Every build step
      # happens exactly once inside it, so nothing here may repeat one.
      - run: pnpm check
