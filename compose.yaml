# The whole application: the app, its database, and the web server that holds
# the certificate. Three containers on one rented machine.
#
# Used in two places, which is why a few values come from the environment:
#
#   on a laptop   docker compose up --build
#   on the server docker compose -f releases/<sha>/compose.yaml \
#                   --project-directory /opt/<app> \
#                   --env-file /opt/<app>/.env --env-file /opt/<app>/.release.env ...
#
# Two --env-file flags, not one: passing --env-file replaces the .env Compose
# would otherwise read by itself, so the file holding POSTGRES_PASSWORD has to
# be named again beside the one holding APP_RELEASE.
#
# The two files are two homes for two kinds of fact. The server's .env holds
# secrets and what only the server knows (its name, its backup folder); it is
# written once by deploy/server-setup.sh. The release file holds the commit and
# the facts about the app — name, time zone, locale — which deploy/release.mjs
# copies from inhouse.config.json on every release, so the server always says
# what the repository says.
#
# Relative paths below resolve against the project directory (/opt/<app> on the
# server), not against this file. That is deliberate for ./Caddyfile — it must
# be the same file across releases so Caddy is never restarted by a release —
# and it is why the build context is $APP_SOURCE instead of ".": the source of
# the release being built lives in releases/<sha>, not in the project directory.

# The project name prefixes every container and volume — pgdata becomes
# <name>_pgdata — so it must never change on a server that has data. It is the
# short lowercase name server-setup.sh was given, not APP_NAME: that is the
# name people see, may have capitals and spaces, and may be renamed at will.
name: ${APP_SLUG:-inhouse}

services:
  app:
    build:
      context: ${APP_SOURCE:-.}
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
    image: ${APP_IMAGE:-inhouse-app}:${APP_RELEASE:-dev}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATA_DIR: /data
      APP_RELEASE: ${APP_RELEASE:-dev}
      # The facts about the app. Named here, and not left to env_file, because
      # they arrive in the release file — which Compose reads to fill in the
      # values in this file but does not hand to the container. These lines also
      # win over any stale copy in an older server's .env.
      APP_NAME: ${APP_NAME:-InHouse}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en-US}
      # Assembled here rather than stored in .env so there is one place holding
      # the password and one spelling of the database's address. APP_DATABASE
      # is set only by the release's migration rehearsal, to point one
      # throwaway container at the rehearsal copy without the password ever
      # appearing on a command line.
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing; it belongs in .env}@db:5432/${APP_DATABASE:-app}
      # The health page warns when the newest file here is more than a day and a
      # half old. Read-only: the app looks at the dumps, it never writes them.
      BACKUP_DIR: /backups
    volumes:
      - appdata:/data
      # /var/backups/<app> on the server, written into .env by server-setup.sh.
      # On a laptop, a folder under data/, which Git ignores.
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    # node -e, not wget or curl: node:24-slim has neither, and installing one
    # only so the health check can run adds a package to the attack surface for
    # the sake of a line that Node already does natively.
    #
    # The JavaScript is in quotes because it contains "? " and ": ", which YAML
    # reads as a mapping if the line is left bare — the check then becomes a
    # nested object, Docker rejects it, and the app has no health check at all.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Enforced by `docker compose up` on a plain Docker engine — no Swarm
    # involved. A runaway query or a leak then starves this container instead of
    # the machine, and the database and the web server keep answering.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    # Unbounded container logs are how a disk reaches 92% full without anyone
    # doing anything wrong. 30 MB per container is plenty for a week.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing; it belongs in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:`. A published port is opened by Docker in the NAT table, below
    # ufw's rules, so `ufw deny incoming` would not stop it — the database would
    # be on the public internet with a password as its only defence. The app
    # reaches it over the private compose network; a person reaches it through
    # an SSH tunnel.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is missing; it belongs in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # Same path in every release, so a release never restarts the web server
      # and never interrupts a certificate renewal in flight.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and their account key. Losing this volume means asking
      # Let's Encrypt for everything again, which is rate-limited.
      - caddy_data:/data
      - caddy_config:/config
    # service_started, not service_healthy: Caddy has to be listening even while
    # the app container is down, otherwise a failed release turns into a browser
    # error about the connection instead of the app's own retry window.
    depends_on:
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  # The database. This is the one that matters; see docs/backups.md.
  pgdata:
  # Uploaded attachments and anything else the app writes to DATA_DIR.
  appdata:
  caddy_data:
  caddy_config:
